# Template only. No bot is launched by this file. Never load exchange keys for paper.
app: {mode: paper, allow_live: false, log_level: info, log_format: json}
database: {max_conns: 6}
exchanges:
  binance: {enabled: true, testnet: false}
marketdata:
  exchange: binance
  markets: [spot]
  symbols: [ETHUSDT]
  timeframes: [1m, 4h]
  initial_backfill: 300
web: {enabled: true, listen: '127.0.0.1:18081'}
metrics: {enabled: true, listen: '127.0.0.1:19101'}
telegram: {enabled: false, notify_level: warn, daily_summary: true, fx: true}
strategies: []
# Frozen ETH-only reference. One total virtual capital, no automatic BTC allocation.
# Prospective trial runs on VPS only; this file never starts it automatically.
backtest:
  slippage_bps: 2
  fees:
    spot: {maker: 0.001, taker: 0.001}
wallets:
  - id: eth-research
    exchange: binance
    quote: USDT
    capital: '110.79104808331486'
    risk: &eth_risk
      risk_per_trade: 0.03
      position_pct: 0.75
      max_position_pct: 0.75
      max_leverage: 1
      max_open_positions: 1
      max_exposure_pct: 1
      daily_loss_limit: 0.08
      max_drawdown: 0.30
      close_on_kill: true
    instances:
      - id: momentum
        name: ETH momentum 4h
        allocation: '110.79104808331486'
        risk: *eth_risk
        notify: warn
        strategies:
          - id: eth4h
            name: trendspot
            symbols: [ETHUSDT]
            risk: *eth_risk
            params: {mode: momentum, timeframe: 4h, entry_period: 84, trend_period: 100, exit_period: 20, atr_period: 14, stop_atr: 3, trail_atr: 3, target_atr: 0, momentum_min: 0.05}
