# Copy to configs/config.yaml and adjust.
# Secrets (database password, API keys) go in .env or the environment,
# never in this file. See .env.example.

app:
  mode: paper          # backtest | paper | testnet | live
  log_level: info      # debug | info | warn | error
  log_format: text     # json | text

database:
  # url is set via TB_DATABASE__URL
  max_conns: 10

metrics:
  enabled: true
  listen: 127.0.0.1:9100

exchanges:
  binance:
    enabled: true
    testnet: true
  bybit:
    enabled: false
    testnet: true

# Live candles recorded by `bot run`. Data comes from mainnet unless
# app.mode is testnet (then stored under the exchange name "binance-testnet").
marketdata:
  exchange: binance
  markets: [futures]       # spot and/or futures
  timeframes: [1m, 1h]
  symbols: []              # fixed list, e.g. [BTCUSDT, ETHUSDT]; empty = universe
  initial_backfill: 1000   # candles fetched per series that has no history

# Liquidity ranking used when marketdata.symbols is empty (and by datafetch).
universe:
  quote: USDT
  top_n: 20
  min_quote_volume: 20000000   # 24h volume in quote currency
  max_spread_bps: 10
  # Defaults to stablecoins, fiat, gold and wrapped tokens; setting this list
  # replaces the defaults (see config.DefaultExcludeBases).
  # exclude_bases: [USDC, FDUSD, ...]
  # Exchange categories to skip. Binance tags tokenized stocks and ETFs
  # (NVDAB, GSB, QQQB, ...) "bStocks"; they are excluded by default.
  # exclude_tags: [bStocks]

# Strategy instances. `bot run` starts the enabled ones; `backtest -strategy <id>`
# can run any of them.
strategies:
  - id: emacross-1h
    name: emacross
    enabled: false
    exchange: binance
    market: futures
    symbols: [BTCUSDT, ETHUSDT]   # empty = marketdata symbols / universe
    leverage: 2
    params:
      timeframe: 1h
      fast: 12
      slow: 26
      rsi_period: 14
      rsi_long_max: 70
      rsi_short_min: 30
      atr_period: 14
      stop_atr: 2
      target_atr: 3
      trail_atr: 0
      allow_short: true
      exit_on_cross: true

  # Long grid between lower and upper (one symbol per instance).
  - id: grid-eth
    name: grid
    enabled: false
    exchange: binance
    market: spot
    symbols: [ETHUSDT]
    params: {timeframe: 1m, lower: 2500, upper: 3500, levels: 20, quote_per_level: 20, stop_below: 2300}

  # Scheduled buys, sell all at +3% from the average entry.
  - id: dca-btc
    name: dca
    enabled: false
    exchange: binance
    market: spot
    symbols: [BTCUSDT]
    params: {interval: 24h, quote_amount: 20, max_buys: 10, dip_pct: 0.02, take_profit: 0.03, stop_loss: 0}

  # Cash-and-carry: long spot + short perp while funding is high (Binance:
  # separate spot and futures wallets; both need funds).
  - id: funding-btc
    name: funding
    enabled: false
    exchange: binance
    market: futures
    symbols: [BTCUSDT]
    legs: [{market: spot, symbol: BTCUSDT}]
    leverage: 1
    params: {entry_rate: 0.0003, exit_rate: 0.00005, quote_amount: 100}

  # Cross-exchange perp spread (needs margin on both exchanges).
  - id: xspread-btc
    name: xspread
    enabled: false
    exchange: binance
    market: futures
    symbols: [BTCUSDT]
    legs: [{exchange: bybit, market: futures, symbol: BTCUSDT}]
    leverage: 2
    params: {entry_bps: 30, exit_bps: 5, quote_amount: 100}

  # Basic market maker (post-only quotes around the last price).
  - id: mm-btc
    name: mm
    enabled: false
    exchange: binance
    market: futures
    symbols: [BTCUSDT]
    leverage: 1
    params: {spread_bps: 20, order_quote: 20, max_inventory_quote: 100, skew_bps: 10, requote_bps: 5, min_requote: 5s}

risk:
  risk_per_trade: 0.01     # lose at most 1% of equity when a stop is hit
  position_pct: 0.10       # margin per position when a strategy gives no stop
  max_position_pct: 0.25   # notional cap: 25% of equity x leverage
  max_leverage: 3
  max_open_positions: 3
  max_exposure_pct: 1.5    # total notional cap: 150% of equity
  daily_loss_limit: 0.05   # kill switch at -5% since 00:00 UTC
  max_drawdown: 0.20       # kill switch at -20% from the equity peak
  close_on_kill: true      # also close all positions when the kill switch trips

backtest:
  initial_balance: 1000
  slippage_bps: 2
  funding_rate: 0.0001     # per 8h on futures
  exec_timeframe: ""       # e.g. 1m for realistic intrabar stop fills (needs 1m data)
  fees:
    spot: {maker: 0.001, taker: 0.001}
    futures: {maker: 0.0002, taker: 0.0005}

# Paper trading (app.mode: paper) simulates fills on live mainnet prices,
# using the backtest fees and slippage.
paper:
  initial_balance: 1000   # per account (exchange + market)
  resume: true            # continue the previous paper session's balances and positions

# Telegram notifications and commands (/help lists them).
# Create a bot with @BotFather; the token goes in TB_TELEGRAM__TOKEN.
# Get your chat id by messaging @userinfobot.
telegram:
  enabled: false
  chat_ids: []             # e.g. [123456789]
  notify_level: warn       # engine notices forwarded: info | warn | error
  daily_summary: true      # message at 00:00 UTC
  fx: true                 # show USDT amounts in USD and IDR (CoinGecko, ECB fallback; hourly)

# Web dashboard served by `bot run`. Off localhost it needs TB_WEB__PASSWORD
# (HTTP basic auth, any user name); put it behind TLS (reverse proxy or VPN).
web:
  enabled: true
  listen: 127.0.0.1:8080

# Notes on exchanges:
# - Binance and Bybit symbols use the exchange-native format "BTCUSDT".
# - Bybit unified accounts share one wallet between spot and futures:
#   the bot trades only one market at a time on Bybit.
# - Testnet mode uses the Binance and Bybit testing environments.
