# Copy to configs/config.yaml and adjust.
# Secrets (database password, API keys) go in .env or the environment,
# never in this file. See .env.example.

app:
  mode: paper          # backtest | paper | testnet | live
  log_level: info      # debug | info | warn | error
  log_format: text     # json | text

database:
  # url is set via TB_DATABASE__URL
  max_conns: 10

metrics:
  enabled: true
  listen: 127.0.0.1:9100

exchanges:
  binance:
    enabled: true
    testnet: true
  bybit:
    enabled: false
    testnet: true
  okx:
    enabled: false
    testnet: true

# Live candles recorded by `bot run`. Data comes from mainnet unless
# app.mode is testnet (then stored under the exchange name "binance-testnet").
marketdata:
  exchange: binance
  markets: [futures]       # spot and/or futures
  timeframes: [1m, 1h]
  symbols: []              # fixed list, e.g. [BTCUSDT, ETHUSDT]; empty = universe
  initial_backfill: 1000   # candles fetched per series that has no history

# Liquidity ranking used when marketdata.symbols is empty (and by datafetch).
universe:
  quote: USDT
  top_n: 20
  min_quote_volume: 20000000   # 24h volume in quote currency
  max_spread_bps: 10
  # Defaults to stablecoins, fiat, gold and wrapped tokens; setting this list
  # replaces the defaults (see config.DefaultExcludeBases).
  # exclude_bases: [USDC, FDUSD, ...]

# Strategy instances. `bot run` starts the enabled ones; `backtest -strategy <id>`
# can run any of them.
strategies:
  - id: emacross-1h
    name: emacross
    enabled: false
    exchange: binance
    market: futures
    symbols: [BTCUSDT, ETHUSDT]   # empty = marketdata symbols / universe
    leverage: 2
    params:
      timeframe: 1h
      fast: 12
      slow: 26
      rsi_period: 14
      rsi_long_max: 70
      rsi_short_min: 30
      atr_period: 14
      stop_atr: 2
      target_atr: 3
      trail_atr: 0
      allow_short: true
      exit_on_cross: true

risk:
  risk_per_trade: 0.01     # lose at most 1% of equity when a stop is hit
  position_pct: 0.10       # margin per position when a strategy gives no stop
  max_position_pct: 0.25   # notional cap: 25% of equity x leverage
  max_leverage: 3

backtest:
  initial_balance: 1000
  slippage_bps: 2
  funding_rate: 0.0001     # per 8h on futures
  exec_timeframe: ""       # e.g. 1m for realistic intrabar stop fills (needs 1m data)
  fees:
    spot: {maker: 0.001, taker: 0.001}
    futures: {maker: 0.0002, taker: 0.0005}
