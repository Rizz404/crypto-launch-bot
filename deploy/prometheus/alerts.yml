groups:
  - name: cryptolaunchbot
    rules:
      - alert: CryptoLaunchBotDown
        expr: up{job="cryptolaunchbot"} == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: Crypto launch bot metrics endpoint is down

      - alert: KillSwitchActive
        expr: max(cryptolaunchbot_kill_switch) == 1
        labels: {severity: critical}
        annotations:
          summary: Kill switch tripped; trading is halted

      - alert: StaleMarketData
        expr: time() - min(cryptolaunchbot_marketdata_last_candle_close_timestamp_seconds{timeframe="1m"}) > 300
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: No closed 1m candle for over 5 minutes

      - alert: EngineErrors
        expr: sum(increase(cryptolaunchbot_notices_total{level="error"}[10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: The engine reported errors in the last 10 minutes

      - alert: SlowOrderPlacement
        expr: histogram_quantile(0.95, sum by (le) (rate(cryptolaunchbot_order_place_seconds_bucket[10m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 95th percentile order placement above 2s

      - alert: ExchangeWeightHigh
        expr: max(cryptolaunchbot_exchange_used_weight) > 1800
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Exchange request weight close to the limit
