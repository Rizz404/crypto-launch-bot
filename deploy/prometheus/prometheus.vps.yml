global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tradingbot
    static_configs:
      - targets: ["bot:9100"]
        labels: {instance: container}
      # Research worker is stopped. When it runs again, add back:
