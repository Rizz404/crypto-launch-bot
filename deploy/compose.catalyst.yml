name: trading-bot-catalyst

services:
  catalyst:
    image: ${CATALYST_IMAGE:?set the separately published catalyst image digest}
    restart: "no"
    init: true
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - archive:/var/lib/catalyst

volumes:
  archive:
