# Run from the repository root with --env-file .env.vps.
# BOT_IMAGE must identify an image published by the successful GitHub workflow.
name: trading-bot-paper

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: docker.io/timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: tradingbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
      TIMESCALEDB_TELEMETRY: "off"
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "1"
    command: ["postgres", "-c", "max_connections=40", "-c", "max_wal_size=512MB"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d tradingbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    volumes:
      - ./prometheus/prometheus.vps.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    restart: unless-stopped
    logging: *logging

  grafana:
    image: docker.io/grafana/grafana:13.2.4
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.vps}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      POSTGRES_USER: bot
      POSTGRES_DB: tradingbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    depends_on:
      db:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  # The host resolver may return block-page addresses for exchange domains;
  # see deploy/coredns/Corefile. It only serves the bot.
  dns:
    image: docker.io/coredns/coredns:1.14.7
    command: ["-conf", "/etc/coredns/Corefile"]
    # Grew from 11 to 46 MiB within a day (cache, DoT connections).
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
    networks:
      resolver:
        ipv4_address: 172.31.253.2
    # The binary carries a file capability for port 53, which a non-root user
    # cannot exec under no-new-privileges. Root here holds only that capability.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to the published GHCR image digest}
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    command: ["run"]
    env_file: ../.env.vps
    environment:
      TB_APP__MODE: ${TB_APP__MODE:-paper}
      TB_APP__ALLOW_LIVE: "false"
      # A new trial gets its own database in the same server (BOT_DB_NAME);
      # earlier trials stay untouched in theirs.
      TB_DATABASE__URL: postgres://bot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}@db:5432/${BOT_DB_NAME:-tradingbot}?sslmode=disable
      TB_METRICS__LISTEN: 0.0.0.0:9100
      TB_WEB__LISTEN: 0.0.0.0:8080
      TB_WEB__PASSWORD: ${TB_WEB__PASSWORD:?Set TB_WEB__PASSWORD in .env.vps}
      GOMEMLIMIT: 384MiB
    volumes:
      - ../configs/config.yaml:/app/configs/config.yaml:ro
    ports:
      - "127.0.0.1:${BOT_WEB_PORT:-18080}:8080"
      - "127.0.0.1:${BOT_METRICS_PORT:-19100}:9100"
    # Docker's embedded DNS forwards names it does not know to this address.
    dns: [172.31.253.2]
    networks:
      default:
        gw_priority: 1 # keep the default route on the main network
      resolver: {}
    depends_on:
      db:
        condition: service_healthy
      dns:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

networks:
  resolver:
    ipam:
      config:
        - subnet: 172.31.253.0/29

volumes:
  db-data:
  prometheus-data:
  grafana-data:
