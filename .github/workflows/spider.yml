name: Spider artifact image

on:
  push:
    branches: [main]
    paths: ["Dockerfile.spider", "build/spider-cli.patch", ".github/workflows/spider.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spider-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spider:
    name: Build and publish pinned Spider CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.spider
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/rizz404/trading-bot-spider:2.53.9-p3.1
            ghcr.io/rizz404/trading-bot-spider:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=spider
          cache-to: type=gha,scope=spider,mode=max
      - name: Record digest for Dockerfile.catalyst
        run: printf '### Spider image\n\n`ghcr.io/rizz404/trading-bot-spider@%s`\n' "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
